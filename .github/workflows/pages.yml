name: Deploy Pages

# Deploys docs.hotloop.io on every push to main. Pages keeps serving the last
# successful deployment if a build fails, so a broken build never takes the site
# down. Pages must be set to "GitHub Actions" as its source in the repo settings.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # src/styles/tokens.css is a vendored copy of the canonical file in
      # HotLoop-io/HotLoop-io. If they drift, fail here rather than ship docs whose
      # colors quietly disagree with the brand standard.
      - name: Design tokens match the canonical copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/HotLoop-io/HotLoop-io/main/brand/tokens.css -o "$RUNNER_TEMP/canonical-tokens.css"
          diff -u --strip-trailing-cr "$RUNNER_TEMP/canonical-tokens.css" src/styles/tokens.css

      # The License and Terms pages are the canonical LICENSE.md and TERMS.md, wrapped in a
      # title. Once either file is the new text, its page has to be committed and current, or
      # this fails. Until then there is no page, and nothing here to compare.
      - name: License and Terms pages match the canonical text
        run: |
          base=https://raw.githubusercontent.com/HotLoop-io/HotLoop-io/main
          args="--license $RUNNER_TEMP/LICENSE.md"
          curl -fsSL "$base/LICENSE.md" -o "$RUNNER_TEMP/LICENSE.md"
          if curl -fsSL "$base/TERMS.md" -o "$RUNNER_TEMP/TERMS.md"; then args="$args --terms $RUNNER_TEMP/TERMS.md"; fi
          node scripts/sync-legal.mjs --check $args

      - uses: actions/configure-pages@v6

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
