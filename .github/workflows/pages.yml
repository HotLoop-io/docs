name: Deploy Pages

# Deploys docs.hotloop.io on every push to main. Pages keeps serving the last
# successful deployment if a build fails, so a broken build never takes the site
# down. Pages must be set to "GitHub Actions" as its source in the repo settings.
on:
  push:
    branches: [main]
  # A pull request runs the same build and audit, and never deploys.
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # A pull request's checks run in a slot of their own, and a newer push to the
  # same pull request replaces its older run. Pushes to main keep the one deploy
  # slot, where a newer main replaces a waiting one, because it carries every
  # merge before it.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      # The sitemap dates come from git history, so the checkout is whole, not depth 1 (scripts/sitemap-lastmod.mjs).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      # IndexNow (https://www.indexnow.org/documentation): save the sitemap that is live now, so the ping after the deploy
      # can name exactly the pages that are new or changed.
      - name: Save the live sitemap
        if: github.event_name != 'pull_request'
        env:
          HOST: docs.hotloop.io
          KEY: 8aaa323e345bd01f44e6aed315a3cd04
          ENTRY: sitemap-index.xml
        run: scripts/indexnow.sh snapshot

      - run: npm ci

      # src/styles/tokens.css is a vendored copy of the canonical file in
      # HotLoop-io/HotLoop-io. If they drift, fail here rather than ship docs whose
      # colors quietly disagree with the brand standard.
      - name: Design tokens match the canonical copy
        run: |
          curl -fsSL https://raw.githubusercontent.com/HotLoop-io/HotLoop-io/main/brand/tokens.css -o "$RUNNER_TEMP/canonical-tokens.css"
          diff -u --strip-trailing-cr "$RUNNER_TEMP/canonical-tokens.css" src/styles/tokens.css

      # The Terms page is the canonical TERMS.md, wrapped in a title. It has to be committed and
      # current, or this fails. The License page is a hand-written customer page.
      - name: Terms page matches the canonical text
        run: |
          base=https://raw.githubusercontent.com/HotLoop-io/HotLoop-io/main
          args=""
          if curl -fsSL "$base/TERMS.md" -o "$RUNNER_TEMP/TERMS.md"; then args="--terms $RUNNER_TEMP/TERMS.md"; fi
          node scripts/sync-legal.mjs --check $args

      # The sync's image rules: where a README image lands, and what it refuses.
      - name: Sync image tests
        run: node --test scripts/*.test.mjs

      - uses: actions/configure-pages@v6

      - run: npm run build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Keep the sitemaps for the IndexNow ping
        if: github.event_name != 'pull_request'
        run: mkdir -p indexnow/after && cp dist/sitemap-*.xml indexnow/after/

      - name: Hand the sitemaps to the ping job
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: indexnow
          path: indexnow

  deploy:
    name: Deploy
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # IndexNow: only after the deploy job has put the new site live, never at build time. The script waits until the live
  # site serves the key file and the sitemap just built, then submits the pages that are new or changed.
  indexnow:
    name: Ping IndexNow
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: indexnow
          path: indexnow
      - name: Ping
        env:
          HOST: docs.hotloop.io
          KEY: 8aaa323e345bd01f44e6aed315a3cd04
          ENTRY: sitemap-index.xml
        run: scripts/indexnow.sh ping indexnow/after
